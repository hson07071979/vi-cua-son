<title>Ví Của Sơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --ink:#151935; --muted:#5A6081; --line:#E2E5F0;
  --accent:#4A2BD6; --accent-bg:#EEEAFE; --on-accent:#FFFFFF;
  --good:#0B9467; --good-bg:#E3F6EE; --warn:#C97700; --warn-bg:#FFF3DC;
  --bad:#D92D45; --bad-bg:#FDEAED; --momo:#B8196F; --momo-bg:#FCE7F2;
  --jar:#1570D6; --jar-bg:#E6F0FD; --shadow:0 1px 2px rgba(21,25,53,.05),0 4px 16px rgba(21,25,53,.05);
  --c-gai:#E23D74; --c-an:#E07B00; --c-xang:#1570D6; --c-banbe:#6D4AF0; --c-dam:#0B9467; --c-khac:#6B7194;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1020; --surface:#171A2D; --ink:#EDEFFA; --muted:#A2A7C4; --line:#2A2E48;
  --accent:#8E78FF; --accent-bg:#241F4A; --on-accent:#0E1020;
  --good:#3DD69E; --good-bg:#11302A; --warn:#FFB938; --warn-bg:#3A2C10; --bad:#FF6B7F; --bad-bg:#3D1822;
  --momo:#FF6DB6; --momo-bg:#3A1630; --jar:#5AA8FF; --jar-bg:#12284A; --shadow:none;
  --c-gai:#FF6D9A; --c-an:#FFA53A; --c-xang:#5AA8FF; --c-banbe:#9F86FF; --c-dam:#3DD69E; --c-khac:#9AA0C0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1020; --surface:#171A2D; --ink:#EDEFFA; --muted:#A2A7C4; --line:#2A2E48;
  --accent:#8E78FF; --accent-bg:#241F4A; --on-accent:#0E1020;
  --good:#3DD69E; --good-bg:#11302A; --warn:#FFB938; --warn-bg:#3A2C10; --bad:#FF6B7F; --bad-bg:#3D1822;
  --momo:#FF6DB6; --momo-bg:#3A1630; --jar:#5AA8FF; --jar-bg:#12284A; --shadow:none;
  --c-gai:#FF6D9A; --c-an:#FFA53A; --c-xang:#5AA8FF; --c-banbe:#9F86FF; --c-dam:#3DD69E; --c-khac:#9AA0C0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:700}
.monthnav button:hover:not(:disabled){background:var(--accent-bg)}
.monthnav button:disabled{opacity:.3;cursor:default}
.monthnav b{min-width:112px;text-align:center;font-size:14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--accent);color:var(--on-accent);border:0;border-radius:22px;padding:22px;display:grid;gap:14px}
.hero .label{color:inherit;opacity:.8}
.big{font-size:clamp(34px,8vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.hero .pill{background:rgba(255,255,255,.18)}
:root[data-theme="dark"] .hero .pill{background:rgba(14,16,32,.18)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.momo{background:var(--momo-bg);color:var(--momo)}
.pill.jar{background:var(--jar-bg);color:var(--jar)}.pill.acc{background:var(--accent-bg);color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar>i{background:var(--on-accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}
.cat{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .name{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.star{background:var(--momo-bg);border-radius:14px;padding:10px 12px;border:0}
.momo-card{border-color:transparent;background:var(--momo-bg)}
.momo-card .big{color:var(--momo);font-size:34px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;accent-color:var(--good);flex:none;margin-top:1px}
.chk .amt{margin-left:auto;font-weight:700;white-space:nowrap}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.chk .in{color:var(--good)}.chk .out{color:var(--ink)}.chk .mo{color:var(--momo)}.chk .jr{color:var(--jar)}
.hot{background:var(--bad-bg);border-radius:12px;padding:10px;border-top:0;margin-block:4px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.daynum{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.tx .del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:8px}
.tx .del:hover{background:var(--bad-bg);color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;border:0;background:var(--momo);color:#fff;font-weight:800;font-size:16px;padding:15px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(184,25,111,.35)}
:root[data-theme="dark"] .fab{color:#0E1020}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.amt-in{width:100%;font-size:32px;font-weight:800;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--bg)}
.amt-in:focus{border-color:var(--accent);outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:currentColor;background:var(--accent-bg)}
.field{display:grid;gap:6px}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.warnbox{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.okbox{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.stack{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:2px}
.stack>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px}
.opt.win{border-color:var(--good);background:var(--good-bg)}
.opt.lose{border-color:var(--bad)}
.opt .price{font-size:24px;font-weight:800}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
.jar{display:grid;gap:10px}
.jar-vis{height:120px;width:90px;border:3px solid var(--jar);border-radius:14px 14px 22px 22px;position:relative;overflow:hidden;background:var(--surface)}
.jar-vis i{position:absolute;left:0;right:0;bottom:0;background:var(--jar);opacity:.85;transition:height .5s}
.jar-row{display:flex;gap:16px;align-items:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px}
.flow{display:grid;gap:2px;font-size:14px}
.fl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.momo-flow .fl{border-bottom:1px solid rgba(184,25,111,.15)}
.duebox{background:var(--surface);border-radius:12px;padding:10px 12px}
.amtbtn{border:0;background:transparent;padding:2px 6px;border-radius:8px;font-weight:700;font-size:15px}
.amtbtn:hover{background:var(--accent-bg)}
.amt-edit{width:120px;border:1.5px solid var(--accent);border-radius:8px;padding:4px 8px;font-weight:700;text-align:right;background:var(--bg)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sec-title h2{font-size:17px}
.note{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Ví Của Sơn</h1><span id="syncState">Đang tải…</span></div>
    <div class="monthnav">
      <button id="prevM" aria-label="Tháng trước">‹</button>
      <b id="mLabel">Tháng 10/2026</b>
      <button id="nextM" aria-label="Tháng sau">›</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">Tổng quan</button>
    <button class="tab" role="tab" data-tab="tx" aria-selected="false">Giao dịch</button>
    <button class="tab" role="tab" data-tab="plan" aria-selected="false">Kế hoạch & MoMo</button>

  <main id="view"></main>
</div>
<button class="fab" id="fab">+ Ghi chi tiêu</button>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(()=>{
const START='2026-10';
const CATS=[
 {id:'gai',name:'Gái & quà cáp',v:'--c-gai',b:4000000,ab:'G'},
 {id:'an',name:'Ăn uống',v:'--c-an',b:2000000,ab:'Ă'},
 {id:'xang',name:'Xăng xe',v:'--c-xang',b:500000,ab:'X'},
 {id:'banbe',name:'Bạn bè',v:'--c-banbe',b:700000,ab:'B'},
 {id:'dam',name:'Đám tiệc',v:'--c-dam',b:500000,ab:'Đ'},
 {id:'khac',name:'Chi phí khác',v:'--c-khac',b:367000,ab:'K'},
];
const PLAN_SPEND=8067000, MOMO_CAP=3000000;
const JARS=[
 {id:'khancap',name:'Quỹ khẩn cấp',goal:6000000,why:'Đủ 3tr là có thể tự “gối đầu” bằng tiền mình, bỏ luôn MoMo và phí 33k/tháng.'},
 {id:'mang',name:'Tiền mạng 2027',goal:3000000,why:'250k/tháng × 12 tháng = đủ đóng mạng năm sau, khỏi phải mượn MoMo nữa.'},
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const tr=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+(+(a/1e6).toFixed(3)).toLocaleString('vi-VN')+'tr';return s+Math.round(a/1000).toLocaleString('vi-VN')+'k'};
const pad=n=>String(n).padStart(2,'0');
const today=new Date();
const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const todayKey=todayStr.slice(0,7);
const addM=(k,d)=>{let[y,m]=k.split('-').map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`};
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let S={budgets:Object.fromEntries(CATS.map(c=>[c.id,c.b])),months:{},jarlog:[]};
let viewKey=todayKey<START?START:todayKey, tab='home', db=null;
try{const h=location.hash.slice(1);if(['home','tx','plan','jar'].includes(h))tab=h}catch(e){}

// ---------- storage ----------
const LS='vi-cua-son-v1';
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r){S.months=r.months||{};S.jarlog=r.jarlog||[];if(r.budgets)S.budgets={...S.budgets,...r.budgets}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const chains={};
function persist(path,data){
  lsSave();
  if(!db)return;
  chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(path).set(data)).catch(e=>{toast('Chưa lưu lên máy chủ được, dữ liệu vẫn nằm trên máy này.')});
}
function month(k){const m=S.months[k];return m?{tx:[...(m.tx||[])],checks:{...(m.checks||{})},amts:{...(m.amts||{})},auto:{...(m.auto||{})}}:{tx:[],checks:{},amts:{},auto:{}}}
const ia=(i,m)=>(m.amts&&m.amts[i.id]!=null)?m.amts[i.id]:i.amt;
function saveMonth(k,m){S.months[k]=m;MEMO={};persist('months/'+k,m)}
function saveJars(){persist('app/jars',{log:S.jarlog})}
function saveBudgets(){persist('app/settings',{budgets:S.budgets})}

// ---------- plan ----------
function plan(k){
  const oct=k===START;
  const d1=[{id:'d1-in',kind:'in',label:'Nhận lương đợt 1',amt:8000000},
    {id:'d1-dien',kind:'lev',label:'Trả tiền điện bằng Ví Trả Sau (cộng vào nợ ví)',amt:3000000},
    {id:'d1-nuoc',kind:'fixed',label:'Trả tiền nước',amt:400000}];
  const mo=m=>`tháng ${+addM(k,-1).slice(5)}`;
  const B=bill(k), mk=month(k), d1pay=Math.min(1500000,B);
  const d1paid=(mk.amts&&mk.amts['d1-momo']!=null)?mk.amts['d1-momo']:d1pay;
  d1.push({id:'d1-momo',kind:'momo',label:`Trả ví (hoá đơn ${mo()}, hạn 15/${+k.slice(5)})`,amt:d1pay},
    {id:'d1-j1',kind:'jar',jar:'khancap',label:'Bỏ hũ Quỹ khẩn cấp',amt:625000},
    {id:'d1-j2',kind:'jar',jar:'mang',label:'Bỏ hũ Tiền mạng 2027',amt:125000});
  const d15=[{id:'d15-in',kind:'in',label:'Nhận lương đợt 2',amt:5000000},
    {id:'d15-momo',kind:'momo',label:`Trả nốt hoá đơn ${mo()}. HẠN CHÓT HÔM NAY, trả ngay khi lương về`,amt:Math.max(0,B-d1paid),hot:true},
    {id:'d15-j1',kind:'jar',jar:'khancap',label:'Bỏ hũ Quỹ khẩn cấp',amt:oct?570000:625000},
    {id:'d15-j2',kind:'jar',jar:'mang',label:'Bỏ hũ Tiền mạng 2027',amt:125000}];
  const cap=[0,0];
  const out=a=>a.filter(i=>i.kind!=='in'&&i.kind!=='lev').reduce((s,i)=>s+i.amt,0);
  const baseB=CATS.reduce((a,c)=>a+(S.budgets[c.id]||0),0);
  // Điều chỉnh ngân sách: chỉ khi tiền điện tháng trước (trả bằng ví) hoặc tiền nước khác kế hoạch.
  // Khoản quẹt MoMo thêm KHÔNG trừ lại ở đây vì đã tính là chi tiêu ở tháng quẹt (tiền thịt dư ra tháng đó sẽ chuyển sang để trả).
  const water=ia(d1[2],mk);let adj=400000-water;
  if(!oct){const pk=addM(k,-1),u=projUse(pk),tx=month(pk).tx.filter(t=>t.src==='momo').reduce((s,t)=>s+t.amt,0);adj+=3033000-((u-tx)+(u>0?FEE:0))}
  const sumB=baseB+adj;
  const k1=Math.round(baseB*3817/8067/1000)*1000+Math.min(0,adj), k2=sumB-k1;
  const outA=a=>a.filter(i=>i.kind!=='in'&&i.kind!=='lev').reduce((s,i)=>s+ia(i,mk),0);
  const keep=8000000-outA(d1)-k1; // tiền thịt giữ lại từ lương đợt 1 cho kỳ 15
  return {oct,d1,d15,cap,spend:[k1,k2],keep,sumB,baseB,adj,bill:B};
}
function monthStats(k){
  const m=month(k),p=plan(k);
  const spent=m.tx.reduce((s,t)=>s+t.amt,0);
  const byCat={};CATS.forEach(c=>byCat[c.id]=0);m.tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);
  const k1=m.tx.filter(t=>+t.d.slice(8)<15).reduce((s,t)=>s+t.amt,0);
  const momoTx=m.tx.filter(t=>t.src==='momo').reduce((s,t)=>s+t.amt,0);
  const items=[...p.d1,...p.d15],done=items.filter(i=>m.checks[i.id]);
  const sum=kind=>done.filter(i=>i.kind===kind).reduce((s,i)=>s+ia(i,m),0);
  const momoPaidAll=sum('momo'),momoPaid=momoPaidAll;
  const lev=sum('lev'),momoUse=momoTx+lev;
  const inc=sum('in'),fixed=sum('fixed'),jar=sum('jar'),cashSpent=spent-momoTx;
  return {m,p,spent,byCat,k1,k2:spent-k1,momoUse,momoTx,lev,momoPaid,momoPaidAll,momoDue:p.bill,inc,fixed,jar,cashSpent,flow:inc-fixed-momoPaidAll-jar-cashSpent};
}
const FEE=33000, SEP_BILL=3088000; // hoá đơn T9 trên app: 3.088.000đ, hạn 15/10
// Hoá đơn tháng k = mọi khoản dùng ví trong tháng k-1 + phí 33k (nếu tháng đó có dùng ví) + phần hoá đơn cũ chưa trả (trễ)
let MEMO={};const memo=(n,f)=>k=>{const key=n+k;if(!(key in MEMO))MEMO[key]=f(k);return MEMO[key]};
const dienAmt=m=>m.amts['d1-dien']!=null?m.amts['d1-dien']:3000000;
// dùng ví thực tế (chỉ tính tiền điện khi đã tick)
const usedIn=memo('u',k=>{const m=month(k);return (m.checks['d1-dien']?dienAmt(m):0)+m.tx.filter(t=>t.src==='momo').reduce((s,t)=>s+t.amt,0)});
// dùng ví dự kiến để báo trước hoá đơn: chưa tick tiền điện thì vẫn tính 3tr vì tháng nào cũng trả điện bằng ví
const projUse=memo('pu',k=>{const m=month(k);return usedIn(k)+(!m.checks['d1-dien']&&k>=todayKey?dienAmt(m):0)});
const feeOf=k=>usedIn(k)>0?FEE:0;
const d1Pay=k=>{const m=month(k);return m.amts['d1-momo']!=null?m.amts['d1-momo']:Math.min(1500000,bill(k))};
const paidIn=memo('p',k=>{const m=month(k);let t=0;if(m.checks['d1-momo'])t+=d1Pay(k);
  if(m.checks['d15-momo'])t+=m.amts['d15-momo']!=null?m.amts['d15-momo']:Math.max(0,bill(k)-d1Pay(k));return t});
// hoá đơn trả trong tháng k = dùng ví tháng k-1 + phí 33k + phần hoá đơn cũ còn thiếu sau hạn
const bill=memo('b',k=>{if(k<=START)return SEP_BILL;const pk=addM(k,-1);const u=projUse(pk);return Math.max(0,u+(u>0?FEE:0)+carryOf(pk))});
// phần hoá đơn tháng k còn lại: thiếu (chỉ tính sau hạn 15) hoặc trả dư (trừ vào hoá đơn sau)
function carryOf(k){const c=bill(k)-paidIn(k);return c<0?c:(todayStr>`${k}-15`?c:0)}
function lateOf(k){return Math.max(0,carryOf(k))}
const debtOpen=memo('o',k=>{if(k<=START)return SEP_BILL;const pk=addM(k,-1);return debtOpen(pk)+usedIn(pk)-paidIn(pk)+feeOf(pk)});
function momoDebt(k){return debtOpen(k)+usedIn(k)-paidIn(k)}
function cashOf(k){ // tiền thịt: bắt đầu 0 từ tháng 10, dư tháng trước chuyển sang
  let bal=0,key=START,open=0;
  while(key<=k){open=bal;bal+=monthStats(key).flow;key=addM(key,1)}
  return {open,bal};
}
function jarBalance(id){
  let b=0;
  Object.entries(S.months).forEach(([k,m])=>{const p=plan(k);[...p.d1,...p.d15].forEach(i=>{if(i.kind==='jar'&&i.jar===id&&m.checks&&m.checks[i.id])b+=ia(i,m)})});
  S.jarlog.forEach(l=>{if(l.jar===id)b+=l.amt});
  return b;
}

    <div class="sec-title"><h2>Chỉnh ngân sách</h2></div>
    <p class="note" style="margin-top:0">Ăn uống 2tr ≈ 67k/ngày. Gái & quà cáp để 4tr, tháng nào lên 4,5tr thì lấy 500k từ Bạn bè + Chi phí khác, đừng lấy từ hũ.</p>
    <div class="grid g2">${CATS.map(c=>`<div class="field"><label for="b-${c.id}" class="small" style="font-weight:600"><span class="dot" style="display:inline-block;background:var(${c.v})"></span> ${c.name}</label>
      <input id="b-${c.id}" inputmode="numeric" data-budget="${c.id}" value="${(S.budgets[c.id]||0).toLocaleString('vi-VN')}"></div>`).join('')}</div>
    <div style="margin-top:12px" class="${diff===0?'okbox':'warnbox'}">${diff===0?'Tổng 8.067.000đ, khớp đúng dòng tiền.':`Tổng đang ${diff>0?'dư':'thiếu'} ${vnd(Math.abs(diff))} so với 8.067.000đ. ${diff>0?'Bớt mục khác lại cho khớp.':'Phần thiếu có thể bỏ thêm vào hũ.'}`}</div>
  </div>
  <div class="card">
    <div class="sec-title"><h2>Sao lưu & chuyển máy</h2></div>
    <p class="note" style="margin-top:0">Dữ liệu nằm trong máy này. Mỗi tuần bấm sao lưu một lần. Đổi máy hay cài lại app thì khôi phục từ file hoặc đoạn chữ đã copy.</p>
    <div class="row" style="flex-wrap:wrap;justify-content:flex-start;gap:8px">
      ${window.claude?'':'<button class="btn sm" data-bk="file">Tải file sao lưu</button>'}
      <button class="btn sm ghost" data-bk="copy">Copy dữ liệu</button>
      <label class="btn sm ghost" for="bkFile" style="cursor:pointer">Khôi phục từ file</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <div class="field" style="margin-top:10px"><label class="label" for="bkText">Hoặc dán dữ liệu đã copy</label>
      <textarea id="bkText" rows="3" style="border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);width:100%;font:13px/1.4 ui-monospace,monospace"></textarea>
      <button class="btn sm" data-bk="paste" style="justify-self:start">Khôi phục từ đoạn đã dán</button></div>
  </div>
  <div class="card small">
    <div class="label" style="margin-bottom:6px">Nguồn (MoMo, cập nhật phí từ 1/4/2026)</div>
    <ul class="clean">
      <li><a href="https://www.momo.vn/hoi-dap/phi-cham-tra-vi-tra-sau" target="_blank" rel="noopener">Phí chậm trả Ví Trả Sau</a></li>
      <li><a href="https://www.momo.vn/blog/giai-dap-su-dung-vi-tra-sau-tren-momo-co-mat-phi-khong-c116dt1867" target="_blank" rel="noopener">Các loại phí Ví Trả Sau (phí dịch vụ 33k)</a></li>
      <li><a href="https://www.momo.vn/tin-tuc/thong-bao/tat-tan-tat-ve-chuyen-doi-tra-gop-du-no-vi-tra-sau-5766" target="_blank" rel="noopener">Chuyển đổi trả góp dư nợ</a></li>
      <li><a href="https://www.momo.vn/blog/cham-thanh-toan-vi-tra-sau-khong-tra-tien-vi-tra-sau-co-bi-sao-khong-c116dt1136" target="_blank" rel="noopener">Trả chậm có bị nợ xấu không</a></li>
    </ul>
  </div>
  </section>`;
}
function jarView(){
  return `<section class="grid g2" style="margin-top:6px">${JARS.map(j=>{const b=jarBalance(j.id),p=Math.max(0,Math.min(1,b/j.goal));
  return `<div class="card jar"><div class="row"><h2 style="font-size:18px">${j.name}</h2><span class="pill jar">Mục tiêu ${tr(j.goal)}</span></div>
    <div class="jar-row"><div class="jar-vis"><i style="height:${p*100}%"></i></div>
    <div><div class="big" style="font-size:32px;color:var(--jar)">${vnd(b)}</div><div class="small muted">${Math.round(p*100)}% · còn ${tr(Math.max(0,j.goal-b))}</div></div></div>
    <p class="note" style="margin:0">${j.why}</p>
    <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-start">
      <input id="jin-${j.id}" inputmode="numeric" placeholder="Số tiền (vd 200 = 200k)" style="flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)">
      <button class="btn sm" data-jar="${j.id}" data-dir="1">+ Bỏ vào</button><button class="btn sm ghost" data-jar="${j.id}" data-dir="-1">Rút ra</button></div>
  </div>`}).join('')}
  <div class="card"><div class="sec-title"><h2>Lộ trình</h2></div>
    <ul class="clean small"><li>Checklist ngày 1 và 15 có ô “Bỏ hũ”. Tick là tiền tự cộng vào hũ.</li>
    <li>Khẩn cấp: 1,25tr/tháng từ tháng 11. Tháng 1/2027 vượt 3tr, tháng 4/2027 đủ 6tr.</li>
    <li>Tiền mạng: 250k/tháng × 12 tháng = 3tr, đủ đóng mạng năm 2027.</li>
    <li>Hũ chỉ rút cho việc gấp thật sự (xe hư, ốm, điện tăng đột biến), không rút cho quà cáp.</li></ul>
    ${S.jarlog.length?`<div class="label" style="margin-top:14px">Nạp/rút tay</div>${S.jarlog.slice().reverse().slice(0,8).map(l=>`<div class="row small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${+l.d.slice(8)}/${+l.d.slice(5,7)} · ${JARS.find(j=>j.id===l.jar).name}</span><b style="color:${l.amt<0?'var(--bad)':'var(--jar)'}">${l.amt<0?'':'+'}${tr(l.amt)}</b></div>`).join('')}`:''}
  </div></section>`;
}
function render(){
  MEMO={};
  $('#mLabel').textContent=`Tháng ${+viewKey.slice(5)}/${viewKey.slice(0,4)}`;
  $('#prevM').disabled=viewKey<=START;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#view').innerHTML=({home,tx:txView,plan:planView,jar:jarView})[tab]();
}

// ---------- add sheet ----------
function parseAmt(v){let n=+String(v).replace(/[^\d]/g,'');if(n>0&&n<1000)n*=1000;return n}
function openSheet(){
  const k=viewKey;
  const defD=todayKey===k?todayStr:(k>todayKey?k+'-01':k+'-'+pad(dim(k)));
  let cat='an',src='cash';
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="addForm" autocomplete="off">
    <div class="row"><h2 style="font-size:19px">Ghi chi tiêu</h2><button type="button" class="btn sm ghost" id="closeS">Đóng</button></div>
    <div class="field"><input class="amt-in" id="amt" inputmode="numeric" placeholder="0" aria-label="Số tiền"><span class="small muted" id="amtHint">Gõ 50 = 50.000đ</span></div>
    <div class="chips">${[20,50,100,200,500].map(v=>`<button type="button" class="chip" data-q="${v}">+${v}k</button>`).join('')}</div>
    <div class="field"><span class="label">Mục</span><div class="chips" id="catChips">${CATS.map(c=>`<button type="button" class="chip" data-cat="${c.id}" style="color:var(${c.v})" aria-pressed="${c.id===cat}"><span style="color:var(--ink)">${c.name}</span></button>`).join('')}</div></div>
    <div class="field"><span class="label">Trả bằng</span><div class="chips" id="srcChips"><button type="button" class="chip" data-src="cash" aria-pressed="true">Tiền thịt (tiền mặt/bank)</button><button type="button" class="chip" data-src="momo" style="color:var(--momo)" aria-pressed="false"><span style="color:var(--ink)">Đòn bẩy (MoMo)</span></button></div></div>
    <div id="momoWarn"></div>
    <div class="grid g2" style="gap:10px"><div class="field"><label class="label" for="note">Ghi chú</label><input id="note" placeholder="vd: trà sữa với Vy"></div>
    <div class="field"><label class="label" for="date">Ngày</label><input id="date" type="date" value="${defD}"></div></div>
    <button class="btn" type="submit" style="background:var(--momo);color:#fff">Lưu khoản chi</button>
  </form></div>`;
  const amt=$('#amt');setTimeout(()=>amt.focus(),50);
  const upd=()=>{const n=parseAmt(amt.value);$('#amtHint').textContent=n?'= '+vnd(n):'Gõ 50 = 50.000đ';
    const s=monthStats(k),left=MOMO_CAP-s.momoUse;
    $('#momoWarn').innerHTML=src==='momo'?(n>left?`<div class="warnbox">Vượt trần MoMo 3tr tháng này (còn ${tr(Math.max(0,left))}). Nên trả bằng tiền mặt.</div>`:`<div class="small" style="color:var(--momo)">MoMo còn quẹt được ${tr(left-n)} sau khoản này.</div>`):'';};
  amt.addEventListener('input',upd);
  $('#sheetHost').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{amt.value=((parseAmt(amt.value)||0)+ +b.dataset.q*1000).toLocaleString('vi-VN');upd()});
  $('#catChips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;$('#catChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#srcChips').onclick=e=>{const b=e.target.closest('[data-src]');if(!b)return;src=b.dataset.src;$('#srcChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));upd()};
  const close=()=>{$('#sheetHost').innerHTML=''};
  $('#closeS').onclick=close;$('#sbg').onclick=e=>{if(e.target.id==='sbg')close()};
  $('#addForm').onsubmit=e=>{e.preventDefault();const n=parseAmt(amt.value);if(!n){$('#amtHint').textContent='Nhập số tiền trước nhé';amt.focus();return}
    const d=$('#date').value||defD,mk=d.slice(0,7);
    if(mk<START){$('#amtHint').textContent='Web bắt đầu theo dõi từ 1/10/2026';return}
    const m=month(mk);m.tx.push({id:uid(),d,amt:n,cat,src,note:$('#note').value.trim().slice(0,80)});saveMonth(mk,m);
    close();viewKey=mk;render();toast('Đã lưu −'+vnd(n));};
}
function toast(msg){$('#toastHost').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toastHost').innerHTML='',2200)}

// ---------- events ----------
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(_){}render()};
$('#prevM').onclick=()=>{if(viewKey>START){viewKey=addM(viewKey,-1);render()}};
$('#nextM').onclick=()=>{viewKey=addM(viewKey,1);render()};
$('#fab').onclick=openSheet;
$('#view').addEventListener('change',e=>{
  const c=e.target.closest('[data-chk]');
  if(c){const k=c.dataset.k,m=month(k),id=c.dataset.chk;MEMO={};
    const it=[...plan(k).d1,...plan(k).d15].find(i=>i.id===id);
    if(c.checked){m.checks[id]=true;if(m.amts[id]==null&&it){m.amts[id]=it.amt;m.auto[id]=true}} // chốt số tiền lúc tick, sau này không bị tính lại
    else{delete m.checks[id];if(m.auto[id]){delete m.amts[id];delete m.auto[id]}}
    saveMonth(k,m);render();return}
  const ae=e.target.closest('[data-amtedit]');
  if(ae){const k=ae.dataset.k,m=month(k),n=parseAmt(ae.value);if(n){m.amts[ae.dataset.amtedit]=n;delete m.auto[ae.dataset.amtedit];saveMonth(k,m);toast('Đã sửa thành '+vnd(n))}ae.remove();render();return}
  const b=e.target.closest('[data-budget]');
  if(b){const n=+b.value.replace(/[^\d]/g,'');S.budgets[b.dataset.budget]=n;saveBudgets();render()}
});
const dump=()=>JSON.stringify({app:'vi-cua-son',v:1,savedAt:new Date().toISOString(),budgets:S.budgets,months:S.months,jarlog:S.jarlog});
function restore(txt,btn){
  let d;try{d=JSON.parse(txt)}catch(_){toast('Dữ liệu không đọc được, kiểm tra lại đoạn đã dán');return}
  if(!d||typeof d.months!=='object'){toast('Không phải file sao lưu của Ví Của Sơn');return}
  if(btn&&!btn.dataset.armed){btn.dataset.armed='1';const t=btn.textContent;btn.textContent='Bấm lần nữa để ghi đè dữ liệu hiện tại';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},4000);return}
  S.months=d.months||{};S.jarlog=d.jarlog||[];if(d.budgets)S.budgets={...S.budgets,...d.budgets};MEMO={};
  Object.entries(S.months).forEach(([k,m])=>persist('months/'+k,m));saveJars();saveBudgets();render();toast('Đã khôi phục dữ liệu');
}
$('#view').addEventListener('click',e=>{
  const bk=e.target.closest('[data-bk]');
  if(bk){const t=bk.dataset.bk;
    if(t==='file'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download=`vi-cua-son-${todayStr}.json`;document.body.appendChild(a);a.click();a.remove();toast('Đã tải file sao lưu')}
    if(t==='copy'){const txt=dump();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Đã copy, dán vào Ghi chú để giữ'),()=>{const ta=$('#bkText');ta.value=txt;ta.select();toast('Đã chọn sẵn, bấm Copy')})}
    if(t==='paste')restore($('#bkText').value.trim(),bk);
    return}
  const ed=e.target.closest('[data-edit]');
  if(ed){e.preventDefault();const inp=document.createElement('input');inp.className='amt-edit';inp.inputMode='numeric';inp.id='ed-'+ed.dataset.edit;
    inp.value=(+ed.dataset.v).toLocaleString('vi-VN');inp.dataset.amtedit=ed.dataset.edit;inp.dataset.k=ed.dataset.k;ed.replaceWith(inp);inp.focus();inp.select();
    inp.addEventListener('blur',()=>{if(inp.isConnected)render()});
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur()});return}
  const d=e.target.closest('[data-del]');
  if(d){if(d.dataset.armed){const m=month(viewKey);m.tx=m.tx.filter(t=>t.id!==d.dataset.del);saveMonth(viewKey,m);render();toast('Đã xoá')}
    else{d.dataset.armed='1';d.textContent='Chắc chưa?';d.style.color='var(--bad)';setTimeout(()=>{if(d.isConnected){delete d.dataset.armed;d.textContent='Xoá';d.style.color=''}},3000)}return}
  const j=e.target.closest('[data-jar]');
  if(j){const inp=$('#jin-'+j.dataset.jar),n=parseAmt(inp.value);if(!n){inp.focus();return}
    S.jarlog.push({id:uid(),d:todayStr,jar:j.dataset.jar,amt:n*+j.dataset.dir});saveJars();render();toast(+j.dataset.dir>0?'Đã bỏ hũ +'+tr(n):'Đã rút '+tr(n))}
});

// ---------- boot ----------
document.addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files[0]){e.target.files[0].text().then(t=>restore(t,null));e.target.value=''}});
try{if('serviceWorker' in navigator&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js')}catch(_){}
lsLoad();render();
$('#syncState').textContent='Lưu trên máy này';
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){$('#syncState').textContent='Lưu trên trình duyệt này';return}
  $('#syncState').textContent='Đồng bộ mọi thiết bị';
  const err=()=>{$('#syncState').textContent='Mất kết nối, đang lưu tạm trên máy'};
  db.collection('months').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const next={};snap.docs.forEach(d=>next[d.id]=d.data());
    // giữ dữ liệu cũ trên máy nếu máy chủ trống (lần đầu)
    if(snap.empty&&Object.keys(S.months).length){Object.entries(S.months).forEach(([k,m])=>persist('months/'+k,m));return}
    S.months=next;lsSave();render();
  },err);
  db.doc('app/jars').onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;if(d.exists){S.jarlog=[...(d.data().log||[])];lsSave();render()}else if(S.jarlog.length)saveJars()},err);
  db.doc('app/settings').onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;if(d.exists){S.budgets={...S.budgets,...(d.data().budgets||{})};lsSave();render()}},err);
})();
})();
</script>

</body></html>
