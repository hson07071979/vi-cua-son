<!doctype html><html lang="vi"><head><meta charset="utf-8">

</head><body>
<title>Ví Của Sơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --ink:#151935; --muted:#5A6081; --line:#E2E5F0;
  --accent:#4A2BD6; --accent-bg:#EEEAFE; --on-accent:#FFFFFF;
  --good:#0B9467; --good-bg:#E3F6EE; --warn:#C97700; --warn-bg:#FFF3DC;
  --bad:#D92D45; --bad-bg:#FDEAED; --momo:#B8196F; --momo-bg:#FCE7F2;
  --jar:#1570D6; --jar-bg:#E6F0FD; --shadow:0 1px 2px rgba(21,25,53,.05),0 4px 16px rgba(21,25,53,.05);
  --c-gai:#E23D74; --c-an:#E07B00; --c-xang:#1570D6; --c-banbe:#6D4AF0; --c-dam:#0B9467; --c-khac:#6B7194;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1020; --surface:#171A2D; --ink:#EDEFFA; --muted:#A2A7C4; --line:#2A2E48;
  --accent:#8E78FF; --accent-bg:#241F4A; --on-accent:#0E1020;
  --good:#3DD69E; --good-bg:#11302A; --warn:#FFB938; --warn-bg:#3A2C10; --bad:#FF6B7F; --bad-bg:#3D1822;
  --momo:#FF6DB6; --momo-bg:#3A1630; --jar:#5AA8FF; --jar-bg:#12284A; --shadow:none;
  --c-gai:#FF6D9A; --c-an:#FFA53A; --c-xang:#5AA8FF; --c-banbe:#9F86FF; --c-dam:#3DD69E; --c-khac:#9AA0C0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1020; --surface:#171A2D; --ink:#EDEFFA; --muted:#A2A7C4; --line:#2A2E48;
  --accent:#8E78FF; --accent-bg:#241F4A; --on-accent:#0E1020;
  --good:#3DD69E; --good-bg:#11302A; --warn:#FFB938; --warn-bg:#3A2C10; --bad:#FF6B7F; --bad-bg:#3D1822;
  --momo:#FF6DB6; --momo-bg:#3A1630; --jar:#5AA8FF; --jar-bg:#12284A; --shadow:none;
  --c-gai:#FF6D9A; --c-an:#FFA53A; --c-xang:#5AA8FF; --c-banbe:#9F86FF; --c-dam:#3DD69E; --c-khac:#9AA0C0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:700}
.monthnav button:hover:not(:disabled){background:var(--accent-bg)}
.monthnav button:disabled{opacity:.3;cursor:default}
.monthnav b{min-width:112px;text-align:center;font-size:14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--accent);color:var(--on-accent);border:0;border-radius:22px;padding:22px;display:grid;gap:14px}
.hero .label{color:inherit;opacity:.8}
.big{font-size:clamp(34px,8vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.hero .pill{background:rgba(255,255,255,.18)}
:root[data-theme="dark"] .hero .pill{background:rgba(14,16,32,.18)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.momo{background:var(--momo-bg);color:var(--momo)}
.pill.jar{background:var(--jar-bg);color:var(--jar)}.pill.acc{background:var(--accent-bg);color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar>i{background:var(--on-accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}
.cat{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .name{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.star{background:var(--momo-bg);border-radius:14px;padding:10px 12px;border:0}
.momo-card{border-color:transparent;background:var(--momo-bg)}
.momo-card .big{color:var(--momo);font-size:34px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;accent-color:var(--good);flex:none;margin-top:1px}
.chk .amt{margin-left:auto;font-weight:700;white-space:nowrap}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.chk .in{color:var(--good)}.chk .out{color:var(--ink)}.chk .mo{color:var(--momo)}.chk .jr{color:var(--jar)}
.hot{background:var(--bad-bg);border-radius:12px;padding:10px;border-top:0;margin-block:4px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.daynum{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.tx .del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:8px}
.tx .del:hover{background:var(--bad-bg);color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;border:0;background:var(--momo);color:#fff;font-weight:800;font-size:16px;padding:15px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(184,25,111,.35)}
:root[data-theme="dark"] .fab{color:#0E1020}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.amt-in{width:100%;font-size:32px;font-weight:800;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--bg)}
.amt-in:focus{border-color:var(--accent);outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:currentColor;background:var(--accent-bg)}
.field{display:grid;gap:6px}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.warnbox{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.okbox{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.stack{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:2px}
.stack>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px}
.opt.win{border-color:var(--good);background:var(--good-bg)}
.opt.lose{border-color:var(--bad)}
.opt .price{font-size:24px;font-weight:800}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
.jar{display:grid;gap:10px}
.jar-vis{height:120px;width:90px;border:3px solid var(--jar);border-radius:14px 14px 22px 22px;position:relative;overflow:hidden;background:var(--surface)}
.jar-vis i{position:absolute;left:0;right:0;bottom:0;background:var(--jar);opacity:.85;transition:height .5s}
.jar-row{display:flex;gap:16px;align-items:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px}
.flow{display:grid;gap:2px;font-size:14px}
.fl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.momo-flow .fl{border-bottom:1px solid rgba(184,25,111,.15)}
.duebox{background:var(--surface);border-radius:12px;padding:10px 12px}
.amtbtn{border:0;background:transparent;padding:2px 6px;border-radius:8px;font-weight:700;font-size:15px}
.amtbtn:hover{background:var(--accent-bg)}
.amt-edit{width:120px;border:1.5px solid var(--accent);border-radius:8px;padding:4px 8px;font-weight:700;text-align:right;background:var(--bg)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sec-title h2{font-size:17px}
.note{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.rec{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.kpill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;display:inline-block;margin-top:2px}
.k-in{background:var(--good-bg);color:var(--good)}.k-fixed{background:var(--accent-bg);color:var(--accent)}
.k-lev,.k-momo{background:var(--momo-bg);color:var(--momo)}.k-jar{background:var(--jar-bg);color:var(--jar)}
.tx{cursor:pointer}
.tx:hover{background:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:10px;padding:10px;font-weight:700;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"].out{background:var(--momo);color:#fff}
.seg button[aria-pressed="true"].in{background:var(--good);color:#fff}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="appName">Ví Của Sơn</h1><span id="syncState">Đang tải…</span></div>
    <div class="monthnav">
      <button id="prevM" aria-label="Tháng trước">‹</button>
      <b id="mLabel">Tháng</b>
      <button id="nextM" aria-label="Tháng sau">›</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">Tổng quan</button>
    <button class="tab" role="tab" data-tab="tx" aria-selected="false">Giao dịch</button>
    <button class="tab" role="tab" data-tab="fixed" aria-selected="false">Thu chi cố định</button>
    <button class="tab" role="tab" data-tab="plan" aria-selected="false">Ngân sách</button>
    <button class="tab" role="tab" data-tab="jar" aria-selected="false">Hũ để dành</button>
  </nav>
  <main id="view"></main>
</div>
<button class="fab" id="fab">+ Ghi thu chi</button>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(()=>{
const PERSONAL=false;
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const tr=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+(+(a/1e6).toFixed(3)).toLocaleString('vi-VN')+'tr';return s+Math.round(a/1000).toLocaleString('vi-VN')+'k'};
const pad=n=>String(n).padStart(2,'0');
const today=new Date();
const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const todayKey=todayStr.slice(0,7);
const addM=(k,d)=>{let[y,m]=k.split('-').map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`};
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parseAmt(v){let n=+String(v).replace(/[^\d]/g,'');if(n>0&&n<1000)n*=1000;return n}
const mName=k=>`tháng ${+k.slice(5)}`;

// ---------- danh mục ----------
const CATS=[
 {id:'gai',name:'Hẹn hò & quà cáp',v:'--c-gai',ab:'G'},
 {id:'an',name:'Ăn uống',v:'--c-an',ab:'Ă'},
 {id:'xang',name:'Xăng xe',v:'--c-xang',ab:'X'},
 {id:'banbe',name:'Bạn bè',v:'--c-banbe',ab:'B'},
 {id:'dam',name:'Đám tiệc',v:'--c-dam',ab:'Đ'},
 {id:'khac',name:'Chi phí khác',v:'--c-khac',ab:'K'},
];
const INCATS=[
 {id:'thuong',name:'Thưởng / lương thêm',ab:'T'},{id:'hoahong',name:'Hoa hồng',ab:'H'},
 {id:'duoccho',name:'Được cho / tặng',ab:'C'},{id:'ban',name:'Bán đồ',ab:'B'},{id:'thukhac',name:'Thu khác',ab:'+'},
];
const KINDS={in:'Thu vào',fixed:'Chi cố định',lev:'Trả bằng Ví Trả Sau',momo:'Trả hoá đơn ví',jar:'Bỏ hũ'};
const KORDER={in:0,lev:1,fixed:2,momo:3,jar:4};

// ---------- dữ liệu mặc định ----------
function defaults(){
  
  return{
    cfg:{start:todayKey,openDebt:0,fee:0,due:15,cap:0,jars:[
      {id:'khancap',name:'Quỹ khẩn cấp',goal:0,why:''},{id:'muctieu',name:'Hũ mục tiêu',goal:0,why:''}]},
    budgets:{gai:0,an:0,xang:0,banbe:0,dam:0,khac:0},rec:[]};
}
const D0=defaults();
let S={cfg:D0.cfg,budgets:D0.budgets,rec:D0.rec,months:{},jarlog:[]};
let viewKey=todayKey, tab='home', db=null, hasSettings=false;
try{const h=location.hash.slice(1);if(['home','tx','fixed','plan','jar'].includes(h))tab=h}catch(e){}
const st=()=>S.cfg.start;
const JARS=()=>S.cfg.jars||[];

// ---------- lưu trữ ----------
const LS=PERSONAL?'vi-cua-son-v1':'vi-dong-tien-v1';
function applySettings(d){if(!d)return;if(d.budgets)S.budgets={...S.budgets,...d.budgets};if(Array.isArray(d.rec))S.rec=d.rec.map(r=>({...r}));if(d.cfg)S.cfg={...S.cfg,...d.cfg};hasSettings=true}
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r){S.months=r.months||{};S.jarlog=r.jarlog||[];if(r.rec||r.cfg)applySettings(r);else if(r.budgets)S.budgets={...S.budgets,...r.budgets}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const chains={};
function persist(path,data){
  lsSave();if(!db)return;
  chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(path).set(data)).catch(()=>{toast('Chưa lưu lên máy chủ được, dữ liệu vẫn nằm trên máy này.')});
}
function month(k){const m=S.months[k];return m?{tx:[...(m.tx||[])],checks:{...(m.checks||{})},amts:{...(m.amts||{})},auto:{...(m.auto||{})}}:{tx:[],checks:{},amts:{},auto:{}}}
function saveMonth(k,m){S.months[k]=m;MEMO={};persist('months/'+k,m)}
function saveJars(){persist('app/jars',{log:S.jarlog})}
function saveSettings(){MEMO={};hasSettings=true;persist('app/settings',{budgets:S.budgets,rec:S.rec,cfg:S.cfg})}

// ---------- sổ cái ----------
const ia=(i,m)=>(m.amts&&m.amts[i.id]!=null)?m.amts[i.id]:i.amt;
const active=(r,k)=>(!r.from||r.from<=k)&&(!r.until||k<=r.until);
const recOf=k=>S.rec.filter(r=>active(r,k));
const outTx=m=>m.tx.filter(t=>t.type!=='in');
const inTx=m=>m.tx.filter(t=>t.type==='in');
const sumAmt=a=>a.reduce((s,t)=>s+t.amt,0);
let MEMO={};const memo=(n,f)=>k=>{const key=n+k;if(!(key in MEMO))MEMO[key]=f(k);return MEMO[key]};
const momoTxOf=memo('mt',k=>sumAmt(outTx(month(k)).filter(t=>t.src==='momo')));
// Dùng ví thực tế: khoản cố định trả bằng ví đã tick + quẹt MoMo
const usedIn=memo('u',k=>{const m=month(k);return recOf(k).filter(r=>r.kind==='lev'&&m.checks[r.id]).reduce((s,r)=>s+ia(r,m),0)+momoTxOf(k)});
// Dùng ví dự kiến (tháng này/tương lai chưa tick vẫn tính) để báo trước hoá đơn
const projUse=memo('pu',k=>{const m=month(k);return usedIn(k)+(k>=todayKey?recOf(k).filter(r=>r.kind==='lev'&&!m.checks[r.id]).reduce((s,r)=>s+ia(r,m),0):0)});
const feeOf=k=>usedIn(k)>0?S.cfg.fee:0;
const dueStr=k=>`${k}-${pad(Math.min(S.cfg.due,dim(k)))}`;
// Hoá đơn trả trong tháng k = dùng ví tháng trước + phí + phần hoá đơn cũ còn thiếu (sau hạn) hoặc trả dư
const bill=memo('b',k=>{if(k<=st())return S.cfg.openDebt;const pk=addM(k,-1),u=projUse(pk);return Math.max(0,u+(u>0?S.cfg.fee:0)+carryOf(pk))});
function carryOf(k){const c=bill(k)-paidIn(k);return c<0?c:(todayStr>dueStr(k)?c:0)}
const lateOf=k=>Math.max(0,carryOf(k));
const paidIn=memo('p',k=>{const m=month(k);return plan(k).items.filter(i=>i.kind==='momo'&&m.checks[i.id]).reduce((s,i)=>s+ia(i,m),0)});
const debtOpen=memo('o',k=>{if(k<=st())return S.cfg.openDebt;const pk=addM(k,-1);return debtOpen(pk)+usedIn(pk)-paidIn(pk)+feeOf(pk)});
const momoDebt=k=>debtOpen(k)+usedIn(k)-paidIn(k);

const plan=memo('pl',k=>{
  const m=month(k),D=dim(k),pk=addM(k,-1);
  const items=recOf(k).map(r=>({...r})).sort((a,b)=>(a.day-b.day)||(KORDER[a.kind]-KORDER[b.kind]));
  items.forEach(i=>{i.day=Math.min(Math.max(1,+i.day||1),D);
    });
  const B=bill(k);let rem=B;
  items.filter(i=>i.kind==='momo').forEach(i=>{
    i.amt=i.mode==='rest'?Math.max(0,rem):Math.min(i.amt,Math.max(0,rem));rem-=ia(i,m);
    i.sub=`Hoá đơn ${mName(pk)}, hạn ${Math.min(S.cfg.due,D)}/${+k.slice(5)}`;if(i.mode==='rest')i.hot=true;});
  const sum=f=>items.filter(f).reduce((s,i)=>s+ia(i,m),0);
  const inP=sum(i=>i.kind==='in'),fixP=sum(i=>i.kind==='fixed'),jarP=sum(i=>i.kind==='jar');
  // phần hoá đơn ví tính vào tháng này: bỏ phần quẹt MoMo (đã tính là chi tiêu tháng trước) và phần trễ (tiền đó vẫn nằm trong tiền thịt)
  let billB;
  if(k<=st())billB=B;else{const u=projUse(pk);billB=u-momoTxOf(pk)+(u>0?S.cfg.fee:0)+Math.min(0,carryOf(pk))}
  const ins=inTx(m),extraIn=sumAmt(ins),extraIn1=sumAmt(ins.filter(t=>+t.d.slice(8)<15));
  const base=inP-fixP-jarP-billB, spend=base+extraIn;
  const k1b=Math.round(base*14/D/1000)*1000+extraIn1;
  const keep=sum(i=>i.day<15&&i.kind==='in')-sum(i=>i.day<15&&(i.kind==='fixed'||i.kind==='jar'||i.kind==='momo'))-(k1b-extraIn1);
  return {items,B,spend,base,extraIn,k1b,keep,billB,inP,fixP,jarP};
});
function monthStats(k){
  const m=month(k),p=plan(k),outs=outTx(m),ins=inTx(m);
  const spent=sumAmt(outs);
  const byCat={};CATS.forEach(c=>byCat[c.id]=0);outs.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);
  const k1=sumAmt(outs.filter(t=>+t.d.slice(8)<15));
  const momoTx=momoTxOf(k),extraIn=sumAmt(ins);
  const done=p.items.filter(i=>m.checks[i.id]);
  const sum=kind=>done.filter(i=>i.kind===kind).reduce((s,i)=>s+ia(i,m),0);
  const inc=sum('in'),fixed=sum('fixed'),jar=sum('jar'),momoPaid=sum('momo'),lev=sum('lev');
  const cashSpent=spent-momoTx;
  return {m,p,spent,byCat,k1,k2:spent-k1,momoTx,lev,momoUse:momoTx+lev,momoPaid,inc,extraIn,fixed,jar,cashSpent,
    flow:inc+extraIn-fixed-momoPaid-jar-cashSpent};
}
function cashOf(k){let bal=0,key=st(),open=0;while(key<=k){open=bal;bal+=monthStats(key).flow;key=addM(key,1)}return {open,bal}}
function jarBalance(id){
  let b=0;Object.keys(S.months).filter(k=>k>=st()).forEach(k=>{const m=month(k);plan(k).items.forEach(i=>{if(i.kind==='jar'&&i.jar===id&&m.checks[i.id])b+=ia(i,m)})});
  S.jarlog.forEach(l=>{if(l.jar===id)b+=l.amt});return b;
}
const tone=p=>p>1?'bad':p>=.8?'warn':'good';
const usesWallet=()=>S.cfg.openDebt>0||S.cfg.cap>0||S.rec.some(r=>r.kind==='lev'||r.kind==='momo')||Object.values(S.months).some(m=>(m.tx||[]).some(t=>t.src==='momo'));
const line=(l,v)=>`<div class="fl"><span>${l}</span><b>${v>0?'+':v<0?'−':''}${vnd(Math.abs(v))}</b></div>`;

// ---------- giao diện ----------
function catBar(c,spent,budget){
  const p=budget?spent/budget:(spent?2:0),t=tone(p),left=budget-spent;
  return `<div class="cat ${c.id==='gai'?'star':''}">
    <div class="row"><span class="name"><span class="dot" style="background:var(${c.v})"></span>${c.name}</span>
    <span class="small"><b>${tr(spent)}</b> <span class="muted">/ ${tr(budget)}</span></span></div>
    <div class="bar"><i style="width:${Math.min(100,p*100)}%;background:var(${p>1?'--bad':c.v})"></i></div>
    <div class="row small"><span class="pill ${t}" style="padding:2px 9px">${left<0?'Lố '+tr(-left):'Còn '+tr(left)}</span><span class="muted">${budget?Math.round(p*100)+'%':''}</span></div>
  </div>`;
}
function chkItem(i,m,k){
  const done=!!m.checks[i.id];
  const cls={in:'in',fixed:'out',momo:'mo',jar:'jr',lev:'mo'}[i.kind];
  const sign=i.kind==='in'?'+':i.kind==='lev'?'+nợ ':'−';
  const edited=m.amts&&m.amts[i.id]!=null&&!(m.auto&&m.auto[i.id]);
  const extra=i.kind==='lev'?' (trả bằng ví, cộng vào nợ ví)':'';
  return `<label class="chk ${done?'done':''} ${i.hot&&!done?'hot':''}"><input type="checkbox" data-chk="${i.id}" data-k="${k}" ${done?'checked':''}>
    <span class="t">${esc(i.label)}${extra}${i.sub?`<br><span class="small muted">${i.sub}</span>`:''}</span><button type="button" class="amt amtbtn ${cls}" data-edit="${i.id}" data-k="${k}" data-v="${ia(i,m)}" title="Bấm để sửa số tiền thực tế tháng này">${sign}${tr(ia(i,m))}${edited?' ✎':''}</button></label>`;
}
function dayCards(k,s){
  const p=s.p,m=s.m;
  if(!p.items.length)return `<div class="card empty"><b>Chưa có khoản thu chi cố định nào</b><span class="small muted">Thêm lương, tiền nhà, điện nước, trả góp, bỏ hũ… để app tự tính tiền được chi mỗi tháng.</span><button class="btn sm" data-goto="fixed">Thêm khoản cố định</button></div>`;
  const days=[...new Set(p.items.map(i=>i.day))];
  const first1=days.find(d=>d<15),first2=days.find(d=>d>=15);
  return days.map(day=>{const its=p.items.filter(i=>i.day===day),inc=its.filter(i=>i.kind==='in').reduce((a,i)=>a+ia(i,m),0);
    let sub='';
    if(day===first1)sub=`Kỳ 1 (ngày 1–14) được chi <b style="color:var(--ink)">${tr(p.k1b)}</b>${p.keep>0?`, giữ lại <b style="color:var(--ink)">${tr(p.keep)}</b> cho kỳ 15`:''}`;
    if(day===first2)sub=`Kỳ 2 được chi phần còn lại của tháng: <b style="color:var(--ink)">${tr(p.spend-p.k1b)}</b>`;
    return `<div class="card"><div class="dayhead"><div class="daynum">${day}</div><div><h3 style="font-size:16px">Ngày ${day}${inc?` · thu ${tr(inc)}`:''}</h3>
    ${sub?`<div class="small muted">${sub}</div>`:''}</div></div>
    ${its.map(i=>chkItem(i,m,k)).join('')}</div>`}).join('')
    +`<div class="small muted" style="padding:0 4px">Tick khi đã làm xong. Tháng này số thực tế khác thì bấm vào số tiền để sửa. Muốn đổi hẳn cho các tháng sau thì vào tab Thu chi cố định.</div>`;
}
function home(){
  const k=viewKey,s=monthStats(k),p=s.p,D=dim(k);
  const isCur=k===todayKey,isFuture=k>todayKey;
  const d=isCur?today.getDate():(isFuture?1:D);
  const ky=d<15?0:1;
  const kyLeft=ky?p.spend-s.spent:p.k1b-s.k1;
  const kyEnd=ky?D:14,daysLeft=isCur?kyEnd-d+1:(isFuture?(ky?D-14:14):1);
  const perDay=Math.max(0,kyLeft)/Math.max(1,daysLeft);
  const monthLeft=p.spend-s.spent;
  const cash=cashOf(k);
  const wallet=usesWallet();
  let walletCard='';
  if(wallet){
    const debt=momoDebt(k),cap=S.cfg.cap,capLeft=cap-s.momoUse,dOpen=debtOpen(k),lateBefore=k>st()?lateOf(addM(k,-1)):0;
    const mo=p.items.filter(i=>i.kind==='momo'),paid=mo.filter(i=>s.m.checks[i.id]).reduce((a,i)=>a+ia(i,s.m),0),dueLeft=p.B-paid;
    const pk=addM(k,-1),prevLevMiss=k>st()&&pk<todayKey&&recOf(pk).some(r=>r.kind==='lev'&&!month(pk).checks[r.id]);
    walletCard=`<div class="card momo-card">
      <div class="row"><span class="label" style="color:var(--momo)">Đòn bẩy · Ví Trả Sau</span>${cap?`<span class="pill momo" style="background:var(--surface)">Trần ${tr(cap)}/tháng</span>`:''}</div>
      <div class="big">${vnd(debt)}</div>
      <div class="small" style="margin-top:-6px">Đang nợ ví. Khoản trả bằng ví và mọi lần quẹt ví cộng vào đây, không trừ tiền thịt.</div>
      <div class="flow momo-flow">${line('Nợ đầu tháng',dOpen)}${line('Khoản cố định trả bằng ví',s.lev)}${line('Quẹt thêm',s.momoTx)}${line('Đã trả ví',-s.momoPaid)}</div>
      ${cap?`<div class="small">Đã dùng ${tr(s.momoUse)} / ${tr(cap)} · còn dư <b style="color:${capLeft<0?'var(--bad)':'var(--momo)'}">${tr(Math.max(0,capLeft))}</b></div>
      <div class="bar" style="background:var(--surface)"><i style="width:${Math.min(100,s.momoUse/cap*100)}%;background:${capLeft<0?'var(--bad)':'var(--momo)'}"></i></div>`:''}
      <div class="duebox"><div class="row"><b>Tháng này trả hoá đơn ${mName(pk)}</b><b>${tr(p.B)}</b></div>
        ${mo.length?`<div class="small">${mo.map(i=>`Ngày ${i.day}: ${tr(ia(i,s.m))} ${s.m.checks[i.id]?'<span style="color:var(--good);font-weight:700">✓ đã trả</span>':''}`).join(' · ')}</div>`:`<div class="small" style="color:var(--bad)">Chưa có khoản “Trả hoá đơn ví” trong Thu chi cố định.</div>`}
        <div class="small muted">Hạn chót ${Math.min(S.cfg.due,D)}/${+k.slice(5)}. Trả đủ trước hạn = 0đ phạt.</div>
        <div class="small" style="margin-top:4px">Còn phải trả: <b style="color:${dueLeft>0?'var(--momo)':'var(--good)'}">${tr(dueLeft)}</b></div></div>
      ${cap&&capLeft<0?'<div class="warnbox">Đã vượt trần. Phần lố sẽ ăn vào tiền tháng sau.</div>':''}
      ${lateBefore>0?`<div class="warnbox">Hoá đơn ${mName(addM(k,-2))} còn thiếu ${vnd(lateBefore)}, đã quá hạn và đang bị phạt. Trả ngay phần này trước.</div>`:''}
      ${dueLeft>0&&isCur&&d>=S.cfg.due-3&&todayStr<=dueStr(k)?`<div class="warnbox">Còn ${vnd(dueLeft)} phải trả trước hết ngày ${S.cfg.due}/${+k.slice(5)}. Trễ 1–4 ngày phạt 5,25%, quá 10 ngày bị báo CIC.</div>`:''}
      ${dueLeft>0&&todayStr>dueStr(k)?`<div class="warnbox">Hoá đơn ${mName(pk)} còn thiếu ${vnd(dueLeft)}, đã quá hạn. Trả ngay rồi bấm vào số tiền ở ô trả ví sửa thành số đã trả thật.</div>`:''}
      ${prevLevMiss?`<div class="warnbox">${mName(pk)[0].toUpperCase()+mName(pk).slice(1)} còn khoản “Trả bằng Ví Trả Sau” chưa tick. Nếu đã trả thì quay lại tháng đó tick vào, không thì nợ ví và hoá đơn sẽ sai.</div>`:''}
    </div>`;
  }
  return `
  <section class="grid g2" style="margin-top:6px">
    <div class="hero">
      <div class="row"><span class="label">Tiền thịt của bạn · tiền mặt + bank</span>${k===st()?'<span class="pill">Bắt đầu từ 0</span>':''}</div>
      <div class="big">${cash.bal<0?'−':''}${vnd(Math.abs(cash.bal))}</div>
      <div class="flow">
        ${cash.open?line('Dư tháng trước',cash.open):''}
        ${line('Thu cố định đã nhận',s.inc)}
        ${s.extraIn?line('Thu thêm',s.extraIn):''}
        ${s.fixed?line('Chi cố định',-s.fixed):''}
        ${s.momoPaid||wallet?line('Trả ví trả sau',-s.momoPaid):''}
        ${s.jar?line('Bỏ hũ',-s.jar):''}
        ${line('Chi tiêu bằng tiền thịt',-s.cashSpent)}
      </div>
      ${cash.bal<0?'<div class="warnbox" style="background:#fff;color:#D92D45">Tiền thịt đang âm. Tick khoản thu nếu đã nhận, hoặc đang chi quá số tiền đang có.</div>':''}
      <div class="hero-row"><span class="pill">${ky?'Kỳ 15→cuối (đã tính dư/lố kỳ 1)':'Kỳ 1→14'} còn được chi ${tr(kyLeft)}</span><span class="pill">≈ ${tr(perDay)}/ngày · ${daysLeft} ngày</span></div>
    </div>
    ${walletCard||`<div class="card"><div class="label">Tháng ${+k.slice(5)} tóm tắt</div><div class="flow" style="margin-top:8px">${line('Thu',s.inc+s.extraIn)}${line('Chi tiêu',-s.spent)}${line('Chi cố định',-s.fixed)}${line('Bỏ hũ',-s.jar)}</div></div>`}
  </section>
  <section class="grid g2" style="margin-top:14px">
    <div class="card">
      <div class="sec-title"><h2>Ngân sách theo mục</h2><span class="small muted">Được chi ${tr(p.spend)} · còn <b style="color:var(${monthLeft<0?'--bad':'--good'})">${tr(monthLeft)}</b></span></div>
      ${p.extraIn?`<div class="okbox" style="margin-bottom:8px">Tháng này thu thêm ${tr(p.extraIn)}, đã cộng vào tiền được chi.</div>`:''}
      ${CATS.map(c=>catBar(c,s.byCat[c.id]||0,S.budgets[c.id]||0)).join('')}
    </div>
    <div class="grid">${dayCards(k,s)}</div>
  </section>`;
}
function txRow(t){
  const isIn=t.type==='in',c=isIn?(INCATS.find(c=>c.id===t.cat)||INCATS[4]):(CATS.find(c=>c.id===t.cat)||CATS[5]);
  return `<div class="tx" data-open="${t.id}" role="button" tabindex="0"><div class="ic" style="background:var(${isIn?'--good':c.v})">${c.ab}</div>
    <div><div style="font-weight:600">${esc(t.note||c.name)}</div><div class="small muted">${c.name} · ${isIn?'<span style="color:var(--good);font-weight:600">Thu vào tiền thịt</span>':t.src==='momo'?'<span style="color:var(--momo);font-weight:600">Quẹt ví</span>':'Tiền thịt'}</div></div>
    <div style="text-align:right;font-weight:700;color:${isIn?'var(--good)':'var(--ink)'}">${isIn?'+':'−'}${vnd(t.amt)}<div class="small muted" style="font-weight:500">Sửa</div></div></div>`;
}
function txView(){
  const k=viewKey,s=monthStats(k);
  const list=[...s.m.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id));
  const byDay={};list.forEach(t=>(byDay[t.d]=byDay[t.d]||[]).push(t));
  const days=Object.keys(byDay);
  return `<section class="grid" style="margin-top:6px">
  <div class="card"><div class="grid g2" style="gap:10px">
    <div><div class="label">Đã chi ${mName(k)}</div><div class="big" style="font-size:30px">${vnd(s.spent)}</div>
      <div class="hero-row" style="margin-top:6px"><span class="pill acc">Tiền thịt ${tr(s.spent-s.momoTx)}</span>${s.momoTx?`<span class="pill momo">Quẹt ví ${tr(s.momoTx)}</span>`:''}</div></div>
    <div><div class="label">Thu thêm ${mName(k)}</div><div class="big" style="font-size:30px;color:var(--good)">${vnd(s.extraIn)}</div>
      <div class="small muted" style="margin-top:6px">Ngoài các khoản thu cố định (lương…)</div></div></div></div>
  <div class="card">${days.length?days.map(d=>{const o=byDay[d];const out=sumAmt(o.filter(t=>t.type!=='in')),inn=sumAmt(o.filter(t=>t.type==='in'));
    return `<div style="margin-bottom:10px"><div class="label" style="margin-bottom:4px">${+d.slice(8)}/${+d.slice(5,7)}${out?' · chi '+tr(out):''}${inn?' · thu '+tr(inn):''}</div>${o.map(txRow).join('')}</div>`}).join(''):
    `<div class="muted" style="text-align:center;padding:24px 0">Chưa có giao dịch nào trong ${mName(k)}.<br>Bấm <b style="color:var(--momo)">+ Ghi thu chi</b> mỗi lần tiêu hay nhận tiền.</div>`}
  </div></section>`;
}

  const k=viewKey,p=plan(k),m=month(k);
  const days=[...new Set(p.items.map(i=>i.day))];
  const tot=kind=>p.items.filter(i=>i.kind===kind).reduce((a,i)=>a+i.amt,0);

      <b class="${i.kind==='in'?'':''}" style="white-space:nowrap;color:var(${i.kind==='in'?'--good':i.kind==='jar'?'--jar':i.kind==='fixed'?'--ink':'--momo'})">${i.kind==='in'?'+':i.kind==='lev'?'+nợ ':'−'}${amtTxt}</b>
      <button class="btn sm ghost" data-rec="${i.id}">Sửa</button></div>`};
  return `<section class="grid" style="margin-top:6px">
  <div class="card">
    <div class="sec-title"><h2>Thu chi cố định hằng tháng</h2><button class="btn sm" data-rec="new">+ Thêm khoản</button></div>
    <p class="note" style="margin-top:0">Những khoản lặp lại mỗi tháng: lương, tiền nhà, điện nước, trả góp, bỏ hũ… App tự đưa vào checklist từng tháng. Đang xem ${mName(k)}.</p>
    ${days.length?days.map(d=>`<div style="margin-top:8px"><div class="label">Ngày ${d}</div>${p.items.filter(i=>i.day===d).map(recRow).join('')}</div>`).join(''):'<div class="empty"><b>Chưa có khoản nào</b><span class="small muted">Bắt đầu bằng khoản lương hoặc tiền trợ cấp hằng tháng.</span></div>'}
  </div>
  <div class="card">
    <div class="sec-title"><h2>Mỗi tháng ${mName(k)} tiền đi đâu</h2></div>
    <div class="flow">${line('Thu cố định',p.inP)}${p.extraIn?line('Thu thêm (đã ghi)',p.extraIn):''}${line('Chi cố định bằng tiền thịt',-p.fixP)}${line('Trả hoá đơn ví (phần tính vào tháng này)',-p.billB)}${line('Bỏ hũ',-p.jarP)}</div>
    <div class="row" style="margin-top:10px"><b>Còn lại để chi tiêu</b><b style="font-size:20px;color:var(${p.spend<0?'--bad':'--good'})">${vnd(p.spend)}</b></div>

  </div>

      <div class="field"><label class="small" for="cf-openDebt" style="font-weight:600">Hoá đơn ví phải trả trong ${mName(st())}</label><input id="cf-openDebt" data-cfg="openDebt" inputmode="numeric" value="${S.cfg.openDebt.toLocaleString('vi-VN')}"></div>
      <div class="field"><label class="small" for="cf-fee" style="font-weight:600">Phí dịch vụ mỗi tháng có dùng ví</label><input id="cf-fee" data-cfg="fee" inputmode="numeric" value="${S.cfg.fee.toLocaleString('vi-VN')}"></div>
      <div class="field"><label class="small" for="cf-due" style="font-weight:600">Ngày hạn thanh toán</label><input id="cf-due" data-cfg="due" inputmode="numeric" value="${S.cfg.due}"></div>
      <div class="field"><label class="small" for="cf-cap" style="font-weight:600">Trần tự đặt mỗi tháng (0 = không đặt)</label><input id="cf-cap" data-cfg="cap" inputmode="numeric" value="${S.cfg.cap.toLocaleString('vi-VN')}"></div>
      <div class="field"><label class="small" for="cf-start" style="font-weight:600">Bắt đầu theo dõi từ tháng</label><input id="cf-start" data-cfg="start" type="month" value="${st()}"></div>
    </div>
    <p class="note">Không dùng Ví Trả Sau thì để tất cả bằng 0, thẻ ví sẽ tự ẩn.</p>
  </div></section>`;
}
function planView(){
  const k=viewKey,p=plan(k),sumB=CATS.reduce((a,c)=>a+(S.budgets[c.id]||0),0),diff=sumB-p.spend;
  let personal='';
  
  return `<section class="grid" style="margin-top:6px">
  <div class="card">
    <div class="sec-title"><h2>Chia tiền chi tiêu ${mName(k)}</h2></div>
    <div class="row"><span>Tiền được chi (từ Thu chi cố định)</span><b>${vnd(p.spend)}</b></div>
    <div class="row"><span>Đã chia cho các mục</span><b>${vnd(sumB)}</b></div>
    <div style="margin:10px 0" class="${diff===0?'okbox':'warnbox'}">${diff===0?'Chia vừa khớp.':diff>0?`Đang chia dư ${vnd(diff)} so với tiền có. Bớt vài mục lại.`:`Còn ${vnd(-diff)} chưa chia. Có thể thêm vào hũ hoặc để dự phòng.`}</div>
    <div class="grid g2">${CATS.map(c=>`<div class="field"><label for="b-${c.id}" class="small" style="font-weight:600"><span class="dot" style="display:inline-block;background:var(${c.v})"></span> ${c.name}</label>
      <input id="b-${c.id}" inputmode="numeric" data-budget="${c.id}" value="${(S.budgets[c.id]||0).toLocaleString('vi-VN')}"></div>`).join('')}</div>
  </div>
  ${personal}
  <div class="card">
    <div class="sec-title"><h2>Sao lưu & chuyển máy</h2></div>
    <p class="note" style="margin-top:0">Dữ liệu nằm trong máy này. Mỗi tuần sao lưu một lần. Đổi máy hay cài lại app thì khôi phục từ file hoặc đoạn đã copy. Bản sao lưu gồm cả thu chi cố định và cài đặt.</p>
    <div class="row" style="flex-wrap:wrap;justify-content:flex-start;gap:8px">
      ${window.claude?'':'<button class="btn sm" data-bk="file">Tải file sao lưu</button>'}
      <button class="btn sm ghost" data-bk="copy">Copy dữ liệu</button>
      <label class="btn sm ghost" for="bkFile" style="cursor:pointer">Khôi phục từ file</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <div class="field" style="margin-top:10px"><label class="label" for="bkText">Hoặc dán dữ liệu đã copy</label>
      <textarea id="bkText" rows="3" style="border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);width:100%;font:13px/1.4 ui-monospace,monospace"></textarea>
      <button class="btn sm" data-bk="paste" style="justify-self:start">Khôi phục từ đoạn đã dán</button></div>
  </div></section>`;
}
function jarView(){
  return `<section class="grid g2" style="margin-top:6px">${JARS().map(j=>{const b=jarBalance(j.id),p=j.goal?Math.max(0,Math.min(1,b/j.goal)):0;
  return `<div class="card jar"><div class="row"><h2 style="font-size:18px">${esc(j.name)}</h2>${j.goal?`<span class="pill jar">Mục tiêu ${tr(j.goal)}</span>`:''}</div>
    <div class="jar-row"><div class="jar-vis"><i style="height:${p*100}%"></i></div>
    <div><div class="big" style="font-size:32px;color:var(--jar)">${vnd(b)}</div>${j.goal?`<div class="small muted">${Math.round(p*100)}% · còn ${tr(Math.max(0,j.goal-b))}</div>`:''}</div></div>
    ${j.why?`<p class="note" style="margin:0">${esc(j.why)}</p>`:''}
    <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-start">
      <input id="jin-${j.id}" inputmode="numeric" placeholder="Số tiền (vd 200 = 200k)" style="flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)">
      <button class="btn sm" data-jar="${j.id}" data-dir="1">+ Bỏ vào</button><button class="btn sm ghost" data-jar="${j.id}" data-dir="-1">Rút ra</button></div>
    <div class="grid g2" style="gap:8px"><div class="field"><label class="small" for="jn-${j.id}">Tên hũ</label><input id="jn-${j.id}" data-jarname="${j.id}" value="${esc(j.name)}"></div>
      <div class="field"><label class="small" for="jg-${j.id}">Mục tiêu</label><input id="jg-${j.id}" data-jargoal="${j.id}" inputmode="numeric" value="${(j.goal||0).toLocaleString('vi-VN')}"></div></div>
  </div>`}).join('')}
  <div class="card"><div class="sec-title"><h2>Cách dùng hũ</h2></div>
    <ul class="clean small"><li>Thêm khoản “Bỏ hũ” trong Thu chi cố định. Tick trong checklist là tiền tự cộng vào hũ.</li>
    <li>Nạp hoặc rút tay bằng ô số tiền ở từng hũ.</li>
    <li>Hũ chỉ rút cho việc gấp thật sự, không rút cho chi tiêu thường ngày.</li></ul>
    ${S.jarlog.length?`<div class="label" style="margin-top:14px">Nạp/rút tay</div>${S.jarlog.slice().reverse().slice(0,8).map(l=>`<div class="row small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${+l.d.slice(8)}/${+l.d.slice(5,7)} · ${esc((JARS().find(j=>j.id===l.jar)||{name:'Hũ'}).name)}</span><b style="color:${l.amt<0?'var(--bad)':'var(--jar)'}">${l.amt<0?'':'+'}${tr(l.amt)}</b></div>`).join('')}`:''}
  </div></section>`;
}
function render(){
  MEMO={};
  if(viewKey<st())viewKey=st();
  $('#mLabel').textContent=`Tháng ${+viewKey.slice(5)}/${viewKey.slice(0,4)}`;
  $('#prevM').disabled=viewKey<=st();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#view').innerHTML=({home,tx:txView,fixed:fixedView,plan:planView,jar:jarView})[tab]();
}

// ---------- sheet: ghi / sửa thu chi ----------
function closeSheet(){$('#sheetHost').innerHTML=''}
function openSheet(edit){
  const k=viewKey;
  const defD=edit?edit.d:(todayKey===k?todayStr:(k>todayKey?k+'-01':k+'-'+pad(dim(k))));
  let type=edit?(edit.type==='in'?'in':'out'):'out',cat=edit?edit.cat:'an',src=edit?(edit.src||'cash'):'cash';
  const catChips=()=>(type==='in'?INCATS:CATS).map(c=>`<button type="button" class="chip" data-cat="${c.id}" style="color:var(${type==='in'?'--good':c.v})" aria-pressed="${c.id===cat}"><span style="color:var(--ink)">${c.name}</span></button>`).join('');
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="addForm" autocomplete="off">
    <div class="row"><h2 style="font-size:19px">${edit?'Sửa giao dịch':'Ghi thu chi'}</h2><button type="button" class="btn sm ghost" id="closeS">Đóng</button></div>
    <div class="seg" id="typeSeg"><button type="button" class="out" data-type="out" aria-pressed="${type==='out'}">Chi ra</button><button type="button" class="in" data-type="in" aria-pressed="${type==='in'}">Thu vào</button></div>
    <div class="field"><input class="amt-in" id="amt" inputmode="numeric" placeholder="0" aria-label="Số tiền" value="${edit?edit.amt.toLocaleString('vi-VN'):''}"><span class="small muted" id="amtHint">Gõ 50 = 50.000đ</span></div>
    <div class="chips">${[20,50,100,200,500].map(v=>`<button type="button" class="chip" data-q="${v}">+${v}k</button>`).join('')}</div>
    <div class="field"><span class="label">Mục</span><div class="chips" id="catChips">${catChips()}</div></div>
    <div class="field" id="srcField"><span class="label">Trả bằng</span><div class="chips" id="srcChips"><button type="button" class="chip" data-src="cash" aria-pressed="${src!=='momo'}">Tiền thịt (tiền mặt/bank)</button><button type="button" class="chip" data-src="momo" style="color:var(--momo)" aria-pressed="${src==='momo'}"><span style="color:var(--ink)">Quẹt Ví Trả Sau</span></button></div></div>
    <div id="momoWarn"></div>
    <div class="grid g2" style="gap:10px"><div class="field"><label class="label" for="note">Ghi chú</label><input id="note" placeholder="${type==='in'?'vd: hoa hồng':'vd: trà sữa'}" value="${edit?esc(edit.note||''):''}"></div>
    <div class="field"><label class="label" for="date">Ngày</label><input id="date" type="date" value="${defD}"></div></div>
    <button class="btn" type="submit" id="saveBtn">Lưu</button>
    ${edit?'<button type="button" class="btn ghost" id="delTx" style="color:var(--bad)">Xoá giao dịch này</button>':''}
  </form></div>`;
  const amt=$('#amt');if(!edit)setTimeout(()=>amt.focus(),50);
  const paint=()=>{$('#srcField').hidden=type==='in';const sb=$('#saveBtn');sb.style.background=type==='in'?'var(--good)':'var(--momo)';sb.style.color='#fff';sb.textContent=edit?'Lưu thay đổi':(type==='in'?'Lưu khoản thu':'Lưu khoản chi');upd()};
  const upd=()=>{const n=parseAmt(amt.value);$('#amtHint').textContent=n?'= '+vnd(n):'Gõ 50 = 50.000đ';
    const cap=S.cfg.cap;
    if(type==='out'&&src==='momo'&&cap){const s=monthStats(k),left=cap-s.momoUse+(edit&&edit.src==='momo'&&edit.type!=='in'?edit.amt:0);
      $('#momoWarn').innerHTML=n>left?`<div class="warnbox">Vượt trần ví tháng này (còn ${tr(Math.max(0,left))}). Nên trả bằng tiền thịt.</div>`:`<div class="small" style="color:var(--momo)">Ví còn quẹt được ${tr(left-n)} sau khoản này.</div>`}
    else $('#momoWarn').innerHTML='';};
  amt.addEventListener('input',upd);
  $('#sheetHost').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{amt.value=((parseAmt(amt.value)||0)+ +b.dataset.q*1000).toLocaleString('vi-VN');upd()});
  $('#typeSeg').onclick=e=>{const b=e.target.closest('[data-type]');if(!b||b.dataset.type===type)return;type=b.dataset.type;cat=type==='in'?'thuong':'an';
    $('#typeSeg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#catChips').innerHTML=catChips();paint()};
  $('#catChips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;$('#catChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#srcChips').onclick=e=>{const b=e.target.closest('[data-src]');if(!b)return;src=b.dataset.src;$('#srcChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));upd()};
  $('#closeS').onclick=closeSheet;$('#sbg').onclick=e=>{if(e.target.id==='sbg')closeSheet()};
  if(edit)$('#delTx').onclick=e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Bấm lần nữa để xoá';return}
    const mk=edit.d.slice(0,7),m=month(mk);m.tx=m.tx.filter(t=>t.id!==edit.id);saveMonth(mk,m);closeSheet();render();toast('Đã xoá')};
  $('#addForm').onsubmit=e=>{e.preventDefault();const n=parseAmt(amt.value);if(!n){$('#amtHint').textContent='Nhập số tiền trước nhé';amt.focus();return}
    const d=$('#date').value||defD,mk=d.slice(0,7);
    if(mk<st()){$('#amtHint').textContent=`App bắt đầu theo dõi từ ${mName(st())}`;return}
    const t={id:edit?edit.id:uid(),d,amt:n,cat,type,note:$('#note').value.trim().slice(0,80)};if(type==='out')t.src=src;
    if(edit){const om=edit.d.slice(0,7),o=month(om);o.tx=o.tx.filter(x=>x.id!==edit.id);if(om!==mk)saveMonth(om,o);else{o.tx.push(t);saveMonth(mk,o);closeSheet();viewKey=mk;render();toast('Đã lưu thay đổi');return}}
    const m=month(mk);m.tx.push(t);saveMonth(mk,m);
    closeSheet();viewKey=mk;render();toast(edit?'Đã lưu thay đổi':(type==='in'?'Đã ghi +':'Đã ghi −')+vnd(n));};
  paint();
}

// ---------- sheet: khoản cố định ----------
function openRecSheet(id){
  const r=id==='new'?null:S.rec.find(x=>x.id===id);
  let kind=r?r.kind:'in',mode=r?(r.mode||'first'):'first';
  const jarOpts=JARS().map(j=>`<option value="${j.id}" ${r&&r.jar===j.id?'selected':''}>${esc(j.name)}</option>`).join('');
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="recForm" autocomplete="off">
    <div class="row"><h2 style="font-size:19px">${r?'Sửa khoản cố định':'Thêm khoản cố định'}</h2><button type="button" class="btn sm ghost" id="closeS">Đóng</button></div>
    <div class="field"><span class="label">Loại</span><div class="chips" id="kindChips">${Object.entries(KINDS).map(([k,n])=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${k===kind}">${n}</button>`).join('')}</div>
      <span class="small muted" id="kindHint"></span></div>
    <div class="field"><label class="label" for="rLabel">Tên khoản</label><input id="rLabel" value="${r?esc(r.label):''}" placeholder="vd: Lương, Tiền nhà, Trả góp điện thoại"></div>
    <div class="field" id="modeField"><span class="label">Cách trả hoá đơn ví</span><div class="chips" id="modeChips">
      <button type="button" class="chip" data-mode="first" aria-pressed="${mode==='first'}">Trả một phần (tối đa số dưới)</button>
      <button type="button" class="chip" data-mode="rest" aria-pressed="${mode==='rest'}">Trả hết phần còn lại</button></div></div>
    <div class="field" id="amtField"><label class="label" for="rAmt" id="rAmtLabel">Số tiền mỗi tháng</label><input class="amt-in" id="rAmt" inputmode="numeric" value="${r&&r.amt?r.amt.toLocaleString('vi-VN'):''}" placeholder="0"><span class="small muted" id="rAmtHint">Gõ 500 = 500.000đ</span></div>
    <div class="field" id="jarField"><label class="label" for="rJar">Bỏ vào hũ</label><select id="rJar">${jarOpts}</select></div>
    <div class="grid g2" style="gap:10px">
      <div class="field"><label class="label" for="rDay">Ngày trong tháng</label><input id="rDay" type="number" min="1" max="31" inputmode="numeric" value="${r?r.day:1}"></div>
      ${r?'':`<div class="field"><label class="label" for="rFrom">Bắt đầu từ tháng</label><input id="rFrom" type="month" value="${viewKey}"></div>`}
    </div>
    ${r?'<p class="note" style="margin:0">Sửa ở đây áp dụng cho mọi tháng chưa tick. Chỉ muốn đổi riêng một tháng thì bấm vào số tiền trong checklist tháng đó.</p>':''}
    <button class="btn" type="submit">${r?'Lưu thay đổi':'Thêm khoản'}</button>
    ${r?`<button type="button" class="btn ghost" id="stopRec" style="color:var(--bad)">Ngừng khoản này từ ${mName(viewKey)}</button>`:''}
  </form></div>`;
  const hints={in:'Tiền vào tiền thịt, vd lương, trợ cấp.',fixed:'Trừ thẳng vào tiền thịt, vd tiền nhà, nước, 4G.',lev:'Trả bằng Ví Trả Sau: không trừ tiền thịt, cộng vào nợ ví, tháng sau trả.',momo:'Khoản trả hoá đơn ví. Số tiền tự tính theo hoá đơn.',jar:'Chuyển tiền thịt vào hũ để dành.'};
  const paint=()=>{$('#modeField').hidden=kind!=='momo';$('#jarField').hidden=kind!=='jar';$('#amtField').hidden=kind==='momo'&&mode==='rest';
    $('#rAmtLabel').textContent=kind==='momo'?'Trả tối đa':'Số tiền mỗi tháng';$('#kindHint').textContent=hints[kind]};
  $('#kindChips').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;kind=b.dataset.kind;$('#kindChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()};
  $('#modeChips').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;$('#modeChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()};
  $('#rAmt').addEventListener('input',()=>{const n=parseAmt($('#rAmt').value);$('#rAmtHint').textContent=n?'= '+vnd(n):'Gõ 500 = 500.000đ'});
  $('#closeS').onclick=closeSheet;$('#sbg').onclick=e=>{if(e.target.id==='sbg')closeSheet()};
  if(r)$('#stopRec').onclick=e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Bấm lần nữa để ngừng (các tháng trước vẫn giữ)';return}
    const until=addM(viewKey,-1);
    if((r.from||st())>until)S.rec=S.rec.filter(x=>x.id!==r.id);else r.until=until;
    saveSettings();closeSheet();render();toast('Đã ngừng khoản này')};
  $('#recForm').onsubmit=e=>{e.preventDefault();
    const label=$('#rLabel').value.trim().slice(0,60)||KINDS[kind];
    const n=parseAmt($('#rAmt').value);
    if(!(kind==='momo'&&mode==='rest')&&!n){$('#rAmtHint').textContent='Nhập số tiền trước nhé';$('#rAmt').focus();return}
    const day=Math.min(31,Math.max(1,parseInt($('#rDay').value,10)||1));
    const obj=r||{id:uid()};
    Object.assign(obj,{kind,label,amt:kind==='momo'&&mode==='rest'?0:n,day});
    if(kind==='momo')obj.mode=mode;else delete obj.mode;
    if(kind==='jar')obj.jar=$('#rJar').value;else delete obj.jar;
    if(!r){const f=$('#rFrom').value;if(f&&f>st())obj.from=f;S.rec.push(obj)}
    saveSettings();closeSheet();render();toast(r?'Đã lưu thay đổi':'Đã thêm khoản cố định');};
  paint();
}
function toast(msg){$('#toastHost').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toastHost').innerHTML='',2200)}

// ---------- sự kiện ----------
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(_){}render()};
$('#prevM').onclick=()=>{if(viewKey>st()){viewKey=addM(viewKey,-1);render()}};
$('#nextM').onclick=()=>{viewKey=addM(viewKey,1);render()};
$('#fab').onclick=()=>openSheet(null);
$('#view').addEventListener('change',e=>{
  const c=e.target.closest('[data-chk]');
  if(c){const k=c.dataset.k,m=month(k),id=c.dataset.chk;MEMO={};
    const it=plan(k).items.find(i=>i.id===id);
    if(c.checked){m.checks[id]=true;if(m.amts[id]==null&&it){m.amts[id]=it.amt;m.auto[id]=true}} // chốt số tiền lúc tick
    else{delete m.checks[id];if(m.auto[id]){delete m.amts[id];delete m.auto[id]}}
    saveMonth(k,m);render();return}
  const ae=e.target.closest('[data-amtedit]');
  if(ae){const k=ae.dataset.k,m=month(k),raw=ae.value.replace(/[^\d]/g,''),n=parseAmt(raw);
    if(raw!==''){m.amts[ae.dataset.amtedit]=n;delete m.auto[ae.dataset.amtedit];saveMonth(k,m);toast('Đã sửa thành '+vnd(n))}ae.remove();render();return}
  const b=e.target.closest('[data-budget]');
  if(b){S.budgets[b.dataset.budget]=+b.value.replace(/[^\d]/g,'');saveSettings();render();return}
  const cf=e.target.closest('[data-cfg]');
  if(cf){const key=cf.dataset.cfg;
    if(key==='start'){if(/^\d{4}-\d{2}$/.test(cf.value))S.cfg.start=cf.value}
    else if(key==='due')S.cfg.due=Math.min(28,Math.max(1,parseInt(cf.value,10)||15));
    else S.cfg[key]=+cf.value.replace(/[^\d]/g,'');
    saveSettings();render();toast('Đã lưu cài đặt');return}
  const jn=e.target.closest('[data-jarname]'),jg=e.target.closest('[data-jargoal]');
  if(jn||jg){const j=JARS().find(x=>x.id===(jn||jg).dataset[jn?'jarname':'jargoal']);if(j){if(jn)j.name=jn.value.trim().slice(0,40)||j.name;else j.goal=+jg.value.replace(/[^\d]/g,'')}
    saveSettings();render();return}
});
const dump=()=>JSON.stringify({app:'vi-cua-son',v:2,savedAt:new Date().toISOString(),cfg:S.cfg,budgets:S.budgets,rec:S.rec,months:S.months,jarlog:S.jarlog});
function restore(txt,btn){
  let d;try{d=JSON.parse(txt)}catch(_){toast('Dữ liệu không đọc được, kiểm tra lại đoạn đã dán');return}
  if(!d||typeof d.months!=='object'){toast('Không phải file sao lưu của app này');return}
  if(btn&&!btn.dataset.armed){btn.dataset.armed='1';const t=btn.textContent;btn.textContent='Bấm lần nữa để ghi đè dữ liệu hiện tại';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},4000);return}
  // bản sao lưu cũ (v1) chưa có cfg/rec: dùng mặc định của bản cá nhân
  if(!d.rec&&!d.cfg&&PERSONAL){const P=defaults();d.rec=P.rec;d.cfg=P.cfg}
  S.months=d.months||{};S.jarlog=d.jarlog||[];applySettings(d);MEMO={};
  Object.entries(S.months).forEach(([k,m])=>persist('months/'+k,m));saveJars();saveSettings();viewKey=todayKey;render();toast('Đã khôi phục dữ liệu');
}
$('#view').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');if(g){tab=g.dataset.goto;render();return}
  const rc=e.target.closest('[data-rec]');if(rc){openRecSheet(rc.dataset.rec);return}
  const op=e.target.closest('[data-open]');if(op){const t=month(viewKey).tx.find(x=>x.id===op.dataset.open);if(t)openSheet(t);return}
  const bk=e.target.closest('[data-bk]');
  if(bk){const t=bk.dataset.bk;
    if(t==='file'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download=`vi-sao-luu-${todayStr}.json`;document.body.appendChild(a);a.click();a.remove();toast('Đã tải file sao lưu')}
    if(t==='copy'){const txt=dump();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Đã copy, dán vào Ghi chú để giữ'),()=>{const ta=$('#bkText');ta.value=txt;ta.select();toast('Đã chọn sẵn, bấm Copy')})}
    if(t==='paste')restore($('#bkText').value.trim(),bk);
    return}
  const ed=e.target.closest('[data-edit]');
  if(ed){e.preventDefault();const inp=document.createElement('input');inp.className='amt-edit';inp.inputMode='numeric';inp.id='ed-'+ed.dataset.edit;
    inp.value=(+ed.dataset.v).toLocaleString('vi-VN');inp.dataset.amtedit=ed.dataset.edit;inp.dataset.k=ed.dataset.k;ed.replaceWith(inp);inp.focus();inp.select();
    inp.addEventListener('blur',()=>{if(inp.isConnected)render()});
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur()});return}
  const j=e.target.closest('[data-jar]');
  if(j){const inp=$('#jin-'+j.dataset.jar),n=parseAmt(inp.value);if(!n){inp.focus();return}
    S.jarlog.push({id:uid(),d:todayStr,jar:j.dataset.jar,amt:n*+j.dataset.dir});saveJars();render();toast(+j.dataset.dir>0?'Đã bỏ hũ +'+tr(n):'Đã rút '+tr(n))}
});
$('#view').addEventListener('keydown',e=>{if(e.key==='Enter'){const op=e.target.closest('[data-open]');if(op)op.click()}});

// ---------- khởi động ----------
document.addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files[0]){e.target.files[0].text().then(t=>restore(t,null));e.target.value=''}});
try{if('serviceWorker' in navigator&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js')}catch(_){}
lsLoad();
if(!hasSettings)lsSave(); // chốt tháng bắt đầu lần đầu mở app
viewKey=todayKey<st()?st():todayKey;
render();
$('#syncState').textContent='Lưu trên máy này';
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){$('#syncState').textContent='Lưu trên máy này';return}
  $('#syncState').textContent='Đồng bộ mọi thiết bị';
  const err=()=>{$('#syncState').textContent='Mất kết nối, đang lưu tạm trên máy'};
  db.collection('months').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const next={};snap.docs.forEach(d=>next[d.id]=d.data());
    if(snap.empty&&Object.keys(S.months).length){Object.entries(S.months).forEach(([k,m])=>persist('months/'+k,m));return}
    S.months=next;lsSave();render();
  },err);
  db.doc('app/jars').onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;if(d.exists){S.jarlog=[...(d.data().log||[])];lsSave();render()}else if(S.jarlog.length)saveJars()},err);
  db.doc('app/settings').onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;
    if(d.exists){const x=d.data();applySettings({budgets:x.budgets,rec:x.rec,cfg:x.cfg});lsSave();render();if(!x.rec)saveSettings()}
    else saveSettings()},err);
})();
})();
</script>

</body></html>
